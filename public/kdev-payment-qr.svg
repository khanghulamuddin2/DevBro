<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 620" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#070b16"/>
      <stop offset="100%" stop-color="#03060c"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- QR Border Glow -->
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#0080ff"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="15" y="15" width="370" height="590" rx="36" fill="url(#cardBg)" stroke="#00d2ff" stroke-width="2.5" stroke-opacity="0.9" filter="url(#neonGlow)"/>
  <rect x="17" y="17" width="366" height="586" rx="34" fill="none" stroke="#0077ff" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Subtle Inner Edge Glow -->
  <path d="M 50 20 L 350 20" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M 160 595 L 240 595" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- BRAND HEADER: KDEV LOGO -->
  <g transform="translate(135, 52)">
    <!-- Stylized Cyan 'K' Icon -->
    <path d="M 0 0 L 14 0 L 14 36 L 0 36 Z" fill="#00c8ff"/>
    <path d="M 16 16 L 33 0 L 46 0 L 26 19 L 46 36 L 33 36 Z" fill="#0088ff"/>
    <polygon points="16,14 31,0 20,0 9,10" fill="#38bdf8"/>
    <!-- Brand Name Text -->
    <text x="56" y="28" fill="#ffffff" font-family="'Plus Jakarta Sans', Inter, -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="1.5">KDEV</text>
  </g>

  <!-- CENTER QR CODE CONTAINER -->
  <g transform="translate(60, 118)">
    <!-- White Card Background with Neon Outline -->
    <rect x="-8" y="-8" width="296" height="296" rx="28" fill="none" stroke="#00d2ff" stroke-width="4" opacity="0.9" filter="url(#cyanGlow)"/>
    <rect x="0" y="0" width="280" height="280" rx="22" fill="#ffffff"/>

    <!-- High-Resolution Crisp QR Matrix Pattern -->
    <g transform="translate(20, 20)">
      <!-- Corner Finder 1 (Top Left) -->
      <rect x="0" y="0" width="64" height="64" rx="10" fill="#050b14"/>
      <rect x="8" y="8" width="48" height="48" rx="6" fill="#ffffff"/>
      <rect x="16" y="16" width="32" height="32" rx="4" fill="#050b14"/>

      <!-- Corner Finder 2 (Top Right) -->
      <rect x="176" y="0" width="64" height="64" rx="10" fill="#050b14"/>
      <rect x="184" y="8" width="48" height="48" rx="6" fill="#ffffff"/>
      <rect x="192" y="16" width="32" height="32" rx="4" fill="#050b14"/>

      <!-- Corner Finder 3 (Bottom Left) -->
      <rect x="0" y="176" width="64" height="64" rx="10" fill="#050b14"/>
      <rect x="8" y="184" width="48" height="48" rx="6" fill="#ffffff"/>
      <rect x="16" y="192" width="32" height="32" rx="4" fill="#050b14"/>

      <!-- Timing Patterns & Alignment Rects -->
      <rect x="74" y="24" width="10" height="10" fill="#050b14"/>
      <rect x="94" y="24" width="10" height="10" fill="#050b14"/>
      <rect x="114" y="24" width="10" height="10" fill="#050b14"/>
      <rect x="134" y="24" width="10" height="10" fill="#050b14"/>
      <rect x="154" y="24" width="10" height="10" fill="#050b14"/>

      <rect x="24" y="74" width="10" height="10" fill="#050b14"/>
      <rect x="24" y="94" width="10" height="10" fill="#050b14"/>
      <rect x="24" y="114" width="10" height="10" fill="#050b14"/>
      <rect x="24" y="134" width="10" height="10" fill="#050b14"/>
      <rect x="24" y="154" width="10" height="10" fill="#050b14"/>

      <!-- Small Alignment Pattern (Bottom Right) -->
      <rect x="168" y="168" width="40" height="40" rx="6" fill="#050b14"/>
      <rect x="176" y="176" width="24" height="24" rx="4" fill="#ffffff"/>
      <rect x="184" y="184" width="8" height="8" fill="#050b14"/>

      <!-- QR Data Module Dots & Blocks -->
      <rect x="74" y="4" width="10" height="10" fill="#050b14"/>
      <rect x="94" y="4" width="18" height="10" fill="#050b14"/>
      <rect x="124" y="4" width="10" height="10" fill="#050b14"/>
      <rect x="144" y="4" width="18" height="10" fill="#050b14"/>

      <rect x="80" y="44" width="12" height="12" fill="#050b14"/>
      <rect x="100" y="44" width="22" height="12" fill="#050b14"/>
      <rect x="134" y="44" width="14" height="12" fill="#050b14"/>
      <rect x="154" y="44" width="10" height="12" fill="#050b14"/>

      <!-- Middle Matrix -->
      <rect x="4" y="74" width="10" height="10" fill="#050b14"/>
      <rect x="44" y="74" width="18" height="10" fill="#050b14"/>
      <rect x="74" y="74" width="22" height="20" fill="#050b14"/>
      <rect x="104" y="74" width="14" height="10" fill="#050b14"/>
      <rect x="126" y="74" width="20" height="20" fill="#050b14"/>
      <rect x="154" y="74" width="18" height="10" fill="#050b14"/>
      <rect x="180" y="74" width="10" height="20" fill="#050b14"/>
      <rect x="200" y="74" width="20" height="10" fill="#050b14"/>
      <rect x="228" y="74" width="10" height="20" fill="#050b14"/>

      <rect x="4" y="94" width="10" height="20" fill="#050b14"/>
      <rect x="44" y="94" width="10" height="10" fill="#050b14"/>
      <rect x="104" y="94" width="14" height="20" fill="#050b14"/>
      <rect x="154" y="94" width="18" height="18" fill="#050b14"/>
      <rect x="194" y="94" width="24" height="12" fill="#050b14"/>

      <rect x="74" y="104" width="20" height="14" fill="#050b14"/>
      <rect x="124" y="104" width="20" height="14" fill="#050b14"/>
      <rect x="176" y="104" width="12" height="22" fill="#050b14"/>
      <rect x="218" y="104" width="14" height="14" fill="#050b14"/>

      <rect x="4" y="124" width="18" height="12" fill="#050b14"/>
      <rect x="34" y="124" width="28" height="12" fill="#050b14"/>
      <rect x="74" y="124" width="10" height="20" fill="#050b14"/>
      <rect x="94" y="124" width="22" height="10" fill="#050b14"/>
      <rect x="124" y="124" width="12" height="20" fill="#050b14"/>
      <rect x="144" y="124" width="22" height="10" fill="#050b14"/>
      <rect x="196" y="124" width="14" height="20" fill="#050b14"/>
      <rect x="220" y="124" width="18" height="10" fill="#050b14"/>

      <rect x="4" y="146" width="10" height="18" fill="#050b14"/>
      <rect x="40" y="146" width="22" height="12" fill="#050b14"/>
      <rect x="94" y="144" width="14" height="20" fill="#050b14"/>
      <rect x="118" y="146" width="18" height="18" fill="#050b14"/>
      <rect x="146" y="146" width="18" height="12" fill="#050b14"/>
      <rect x="174" y="146" width="10" height="18" fill="#050b14"/>
      <rect x="214" y="146" width="22" height="18" fill="#050b14"/>

      <!-- Bottom Matrix -->
      <rect x="74" y="174" width="12" height="22" fill="#050b14"/>
      <rect x="94" y="174" width="20" height="10" fill="#050b14"/>
      <rect x="124" y="174" width="14" height="14" fill="#050b14"/>
      <rect x="146" y="174" width="14" height="22" fill="#050b14"/>
      <rect x="218" y="174" width="18" height="14" fill="#050b14"/>

      <rect x="74" y="206" width="22" height="10" fill="#050b14"/>
      <rect x="104" y="194" width="12" height="22" fill="#050b14"/>
      <rect x="124" y="196" width="14" height="20" fill="#050b14"/>
      <rect x="146" y="206" width="14" height="10" fill="#050b14"/>
      <rect x="218" y="196" width="16" height="20" fill="#050b14"/>

      <rect x="74" y="224" width="14" height="12" fill="#050b14"/>
      <rect x="96" y="224" width="20" height="12" fill="#050b14"/>
      <rect x="124" y="224" width="18" height="12" fill="#050b14"/>
      <rect x="150" y="224" width="20" height="12" fill="#050b14"/>
      <rect x="180" y="224" width="24" height="12" fill="#050b14"/>
      <rect x="214" y="224" width="20" height="12" fill="#050b14"/>
    </g>
  </g>

  <!-- SCAN FRAME ICON [   ] -->
  <g transform="translate(186, 436)" stroke="#00d2ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top-Left Bracket -->
    <path d="M 0 7 L 0 0 L 7 0" />
    <!-- Top-Right Bracket -->
    <path d="M 21 0 L 28 0 L 28 7" />
    <!-- Bottom-Left Bracket -->
    <path d="M 0 17 L 0 24 L 7 24" />
    <!-- Bottom-Right Bracket -->
    <path d="M 21 24 L 28 24 L 28 17" />
  </g>

  <!-- TITLE & SUBTITLE -->
  <text x="200" y="496" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', Inter, -apple-system, sans-serif" font-weight="800" font-size="24" letter-spacing="0.5">Scan to Pay</text>
  <text x="200" y="524" text-anchor="middle" fill="#8aa2be" font-family="'Plus Jakarta Sans', Inter, -apple-system, sans-serif" font-weight="500" font-size="14" letter-spacing="0.2">KDEV Project Payment</text>

  <!-- UPI APPS STRIP -->
  <g transform="translate(70, 545)" opacity="0.85">
    <text x="130" y="16" text-anchor="middle" fill="#38bdf8" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-weight="600" font-size="11" letter-spacing="1">GPay • PhonePe • Paytm • BHIM • UPI</text>
  </g>
</svg>
